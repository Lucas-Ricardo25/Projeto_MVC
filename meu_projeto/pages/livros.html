<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore todas as obras: filtre por status e categoria ou pesquise por título e palavra-chave.">
    <meta name="theme-color" content="#101013">
    <title>Explorar Livros & Obras – Silver Fox Archives</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="manifest" href="../manifest.json">

    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <!-- CABEÇALHO (gerado por js/core/layout.js) -->
    <header id="siteHeader" class="site-header sticky-top"></header>

    <main class="py-5">

        <section class="container mb-5 text-center">
            <span class="section-label">BIBLIOTECA COMPLETA</span>
            <h1 class="display-4 mt-2 mb-3">Explore todas as Obras</h1>
            <p class="lead text-muted mx-auto" style="max-width: 600px;">
                Filtre por categoria ou status de publicação, ou pesquise pelo título e termos-chave para encontrar a história perfeita.
            </p>
        </section>

        <!-- BUSCA E FILTROS -->
        <section class="container mb-4" aria-label="Busca e filtros">
            <div class="filter-bar row g-3 justify-content-center">
                <div class="col-lg-5">
                    <label for="searchInput" class="visually-hidden">Buscar obras</label>
                    <div class="input-group">
                        <span class="input-group-text" aria-hidden="true">🔍</span>
                        <input type="search" id="searchInput" class="form-control" placeholder="Buscar por título, sinopse ou palavra-chave..." autocomplete="off">
                    </div>
                </div>
                <div class="col-6 col-lg-2">
                    <label for="filterStatus" class="visually-hidden">Status</label>
                    <select id="filterStatus" class="form-select"></select>
                </div>
                <div class="col-6 col-lg-2">
                    <label for="filterCategory" class="visually-hidden">Categoria</label>
                    <select id="filterCategory" class="form-select"></select>
                </div>
                <div class="col-12 col-lg-2">
                    <label for="filterSort" class="visually-hidden">Ordenar</label>
                    <select id="filterSort" class="form-select">
                        <option value="recentes">Mais recentes</option>
                        <option value="antigos">Mais antigos</option>
                        <option value="az">Título A–Z</option>
                        <option value="za">Título Z–A</option>
                    </select>
                </div>
            </div>
            <div class="d-flex justify-content-center align-items-center gap-3 mt-3 small text-muted">
                <span id="resultCount" aria-live="polite"></span>
                <button type="button" id="btnClearFilters" class="btn btn-sm btn-link text-decoration-none p-0" hidden>Limpar filtros</button>
            </div>
        </section>

        <!-- GRADE DE LIVROS (renderizada por js/modules/search.js a partir de data/library.js) -->
        <section class="container">
            <div class="row g-4" id="booksGrid"></div>

            <div id="noResults" class="text-center py-5 d-none">
                <h2 class="h4 text-muted">Nenhum livro encontrado</h2>
                <p class="text-muted small">Tente buscar por outro termo ou limpe os filtros.</p>
            </div>
        </section>

    </main>

    <!-- RODAPÉ (gerado por js/core/layout.js) -->
    <footer id="siteFooter" class="site-footer py-4 border-top mt-5"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dados + núcleo -->
    <script src="../data/library.js"></script>
    <script src="../js/core/data.js"></script>
    <script src="../js/core/layout.js"></script>
    <script src="../js/core/storage.js"></script>
    <script src="../js/core/navigation.js"></script>
    <script src="../js/core/app.js"></script>

    <!-- Módulos -->
    <script src="../js/modules/theme.js"></script>
    <script src="../js/modules/notifications.js"></script>
    <script src="../js/modules/favorites.js"></script>
    <script src="../js/modules/search.js"></script>
    <script src="../js/script.js"></script>

    <!-- Recursos do autor (manutenção / edição direta) -->
    <script src="../js/global-admin.js"></script>

</body>
</html>
