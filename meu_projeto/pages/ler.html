<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Leia os capítulos diretamente no site.">
    <meta name="theme-color" content="#101013">
    <title>Leitura – Silver Fox Archives</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="manifest" href="../manifest.json">

    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <!-- CABEÇALHO (gerado por js/core/layout.js) -->
    <header id="siteHeader" class="site-header sticky-top"></header>

    <div id="readingProgressBar" style="position:fixed;top:0;left:0;height:3px;background-color:var(--vmw-primary,#ab966f);width:0%;z-index:1050;transition:width .1s ease;"></div>

    <main class="py-5">
        <div class="container" style="max-width: 860px;">

            <nav aria-label="Trilha" class="small mb-3" id="readerCrumb"></nav>

            <div class="reader-toolbar p-3 mb-5 d-flex flex-wrap align-items-center justify-content-between gap-3">
                <div class="d-flex align-items-center gap-2">
                    <button type="button" id="btnFontDecrease" class="btn btn-sm btn-outline-secondary" aria-label="Diminuir fonte">A−</button>
                    <span id="fontSizeDisplay" class="small text-muted" style="min-width:42px;text-align:center;">18px</span>
                    <button type="button" id="btnFontIncrease" class="btn btn-sm btn-outline-secondary" aria-label="Aumentar fonte">A+</button>
                    <button type="button" id="btnToggleFont" class="btn btn-sm btn-outline-secondary ms-2">Fonte: Serif</button>
                </div>
                <div class="d-flex gap-2" id="readerNavTop"></div>
            </div>

            <div id="readerWrapper">
                <header class="text-center mb-5">
                    <span class="section-label" id="readerChapterLabel"></span>
                    <h1 class="display-6 font-primary" id="readerTitle">Carregando…</h1>
                </header>
                <article id="readerContent"></article>
            </div>

            <hr class="border-secondary border-opacity-10 my-5">
            <div class="d-flex justify-content-between gap-3" id="readerNavBottom"></div>
        </div>
    </main>

    <!-- RODAPÉ (gerado por js/core/layout.js) -->
    <footer id="siteFooter" class="site-footer py-4 border-top mt-5"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dados + núcleo -->
    <script src="../data/library.js"></script>
    <script src="../js/core/data.js"></script>
    <script src="../js/core/layout.js"></script>
    <script src="../js/core/storage.js"></script>
    <script src="../js/core/navigation.js"></script>
    <script src="../js/core/app.js"></script>

    <!-- Módulos -->
    <script src="../js/modules/theme.js"></script>
    <script src="../js/modules/notifications.js"></script>
    <script src="../js/modules/favorites.js"></script>
    <script src="../js/modules/search.js"></script>
    <script src="../js/modules/reader.js"></script>
    <script src="../js/script.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const L = window.Library;
            const params = new URLSearchParams(location.search);
            const book = L.getBook(params.get("livro"));
            const chapters = book ? (book.chapters || []).filter((c) => c.content).sort((a, b) => a.number - b.number) : [];
            const index = book ? chapters.findIndex((c) => c.id === params.get("cap")) : -1;
            const title = document.getElementById("readerTitle");

            if (!book || index === -1) {
                document.title = "Capítulo não encontrado – " + L.getConfig().siteName;
                title.textContent = "Capítulo não encontrado";
                document.getElementById("readerContent").innerHTML =
                    `<p class="text-center text-muted">Este capítulo não existe ou ainda não foi publicado em texto.</p>
                     <p class="text-center"><a href="${book ? L.bookUrl(book.id) : "livros.html"}" class="btn btn-primary-custom">Voltar</a></p>`;
                return;
            }

            const chapter = chapters[index];
            const prev = chapters[index - 1];
            const next = chapters[index + 1];

            document.title = `Cap. ${chapter.number} – ${chapter.title} · ${book.title}`;
            document.getElementById("readerCrumb").innerHTML =
                `<a href="livros.html">Obras</a> › <a href="${L.esc(L.bookUrl(book.id))}">${L.esc(book.title)}</a>`;
            document.getElementById("readerChapterLabel").textContent = `CAPÍTULO ${String(chapter.number).padStart(2, "0")}`;
            title.textContent = chapter.title;

            // parágrafos separados por linha em branco; quebras simples viram <br>
            document.getElementById("readerContent").innerHTML = String(chapter.content)
                .split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean)
                .map((p) => `<p>${L.esc(p).replace(/\n/g, "<br>")}</p>`).join("");

            const navBtn = (c, label, side) => c
                ? `<a href="${L.esc(L.readUrl(book.id, c.id))}" class="btn btn-outline-primary btn-sm">${side === "prev" ? "← " : ""}${label}${side === "next" ? " →" : ""}</a>`
                : `<span></span>`;
            document.getElementById("readerNavTop").innerHTML =
                (prev ? navBtn(prev, "Anterior", "prev") : "") + (next ? navBtn(next, "Próximo", "next") : "");
            document.getElementById("readerNavBottom").innerHTML =
                navBtn(prev, "Capítulo anterior", "prev") +
                (next ? navBtn(next, "Próximo capítulo", "next")
                      : `<a href="${L.esc(L.bookUrl(book.id))}" class="btn btn-primary-custom btn-sm">Concluir ✓</a>`);

            // salva onde o leitor parou e marca o capítulo como lido ao chegar perto do fim
            let state = {};
            try { state = JSON.parse(localStorage.getItem("sf_reading")) || {}; } catch (e) {}
            state[book.id] = state[book.id] || { last: null, read: [] };
            state[book.id].last = chapter.id;
            const save = () => { try { localStorage.setItem("sf_reading", JSON.stringify(state)); } catch (e) {} };
            save();
            window.addEventListener("scroll", () => {
                const max = document.documentElement.scrollHeight - window.innerHeight;
                if (max > 0 && window.scrollY / max > 0.9 && !state[book.id].read.includes(chapter.id)) {
                    state[book.id].read.push(chapter.id);
                    save();
                }
            }, { passive: true });
        });
    </script>

    <!-- Recursos do autor (manutenção / edição direta) -->
    <script src="../js/global-admin.js"></script>

</body>
</html>
