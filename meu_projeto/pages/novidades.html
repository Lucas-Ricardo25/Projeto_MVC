<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Linha do tempo com as últimas atualizações do acervo.">
    <meta name="theme-color" content="#101013">
    <title>Novidades – Silver Fox Archives</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="manifest" href="../manifest.json">

    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <!-- CABEÇALHO (gerado por js/core/layout.js) -->
    <header id="siteHeader" class="site-header sticky-top"></header>

    <main class="py-5">
        <section class="container mb-5 text-center">
            <span class="section-label">ATUALIZAÇÕES</span>
            <h1 class="display-4 mt-2 mb-3">Novidades do Acervo</h1>
            <p class="lead text-muted mx-auto" style="max-width: 600px;">
                Capítulos e obras publicados ou atualizados recentemente.
            </p>
        </section>
        <section class="container" style="max-width: 760px;">
            <div id="newsTimeline" class="timeline"></div>
        </section>
    </main>

    <!-- RODAPÉ (gerado por js/core/layout.js) -->
    <footer id="siteFooter" class="site-footer py-4 border-top mt-5"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dados + núcleo -->
    <script src="../data/library.js"></script>
    <script src="../js/core/data.js"></script>
    <script src="../js/core/layout.js"></script>
    <script src="../js/core/storage.js"></script>
    <script src="../js/core/navigation.js"></script>
    <script src="../js/core/app.js"></script>

    <!-- Módulos -->
    <script src="../js/modules/theme.js"></script>
    <script src="../js/modules/notifications.js"></script>
    <script src="../js/modules/favorites.js"></script>
    <script src="../js/modules/search.js"></script>
    <script src="../js/script.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const L = window.Library;
            const events = [];
            L.getBooks().forEach((b) => {
                const dated = (b.chapters || []).filter((c) => c.date);
                dated.forEach((c) => events.push({
                    date: c.date, book: b,
                    text: `Capítulo ${c.number} – “${c.title}” publicado`,
                    href: c.content ? L.readUrl(b.id, c.id) : L.bookUrl(b.id)
                }));
                // obras sem capítulos datados entram pela data de atualização
                if (!dated.length && b.updatedAt) events.push({ date: b.updatedAt, book: b, text: "Obra atualizada no acervo", href: L.bookUrl(b.id) });
            });
            events.sort((a, b) => b.date.localeCompare(a.date));

            const box = document.getElementById("newsTimeline");
            if (!events.length) {
                box.innerHTML = `<p class="text-muted">Nenhuma novidade registrada ainda.</p>`;
                return;
            }
            box.innerHTML = events.map((e) => `
                <div class="timeline-item">
                    <small class="text-muted d-block mb-1">${L.esc(L.formatDate(e.date))}</small>
                    <h2 class="h6 mb-1"><a href="${L.esc(e.href)}" class="text-decoration-none">${L.esc(e.book.title)}</a></h2>
                    <p class="text-muted small mb-0">${L.esc(e.text)}</p>
                </div>`).join("");
        });
    </script>

    <!-- Recursos do autor (manutenção / edição direta) -->
    <script src="../js/global-admin.js"></script>

</body>
</html>
