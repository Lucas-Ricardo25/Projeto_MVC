<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fichas de personagens, raças e artefatos dos universos do Silver Fox Archives.">
    <meta name="theme-color" content="#101013">
    <title>Fichas, Bestiário & Artefatos – Silver Fox Archives</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="manifest" href="../manifest.json">

    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <!-- CABEÇALHO (gerado por js/core/layout.js) -->
    <header id="siteHeader" class="site-header sticky-top"></header>

    <main class="py-5">

        <section class="container mb-5 text-center">
            <span class="section-label">ARQUIVOS TÉCNICOS & LORE</span>
            <h1 class="display-4 mt-2 mb-3">Fichas, Bestiário & Artefatos</h1>
            <p class="lead text-muted mx-auto" style="max-width: 600px;">
                Consulte perfis detalhados de personagens, características de raças e especificações de itens lendários.
            </p>
        </section>

        <section class="container mb-4" aria-label="Busca e filtros">
            <div class="filter-bar row g-3 justify-content-center align-items-center">
                <div class="col-lg-5">
                    <label for="sheetSearch" class="visually-hidden">Buscar fichas</label>
                    <div class="input-group">
                        <span class="input-group-text" aria-hidden="true">🔍</span>
                        <input type="search" id="sheetSearch" class="form-control" placeholder="Buscar por nome, raça ou palavra-chave..." autocomplete="off">
                    </div>
                </div>
                <div class="col-lg-6 d-flex gap-2 justify-content-center justify-content-lg-start flex-wrap" id="sheetFilters" role="group" aria-label="Filtrar por tipo"></div>
            </div>
            <p id="sheetCount" class="text-center small text-muted mt-3 mb-0" aria-live="polite"></p>
        </section>

        <section class="container">
            <div class="row g-4" id="sheetsGrid" data-dynamic></div>
            <div id="noSheets" class="text-center py-5 d-none">
                <h2 class="h4 text-muted">Nenhuma ficha encontrada</h2>
                <p class="text-muted small">Tente buscar por outro termo ou alterar os filtros.</p>
            </div>
        </section>

    </main>

    <!-- RODAPÉ (gerado por js/core/layout.js) -->
    <footer id="siteFooter" class="site-footer"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dados + núcleo -->
    <script src="../data/library.js"></script>
    <script src="../js/core/data.js"></script>
    <script src="../js/core/layout.js"></script>
    <script src="../js/core/storage.js"></script>
    <script src="../js/core/navigation.js"></script>
    <script src="../js/core/app.js"></script>

    <!-- Módulos -->
    <script src="../js/modules/theme.js"></script>
    <script src="../js/modules/notifications.js"></script>
    <script src="../js/modules/favorites.js"></script>
    <script src="../js/modules/search.js"></script>
    <script src="../js/modules/codex.js"></script>
    <script src="../js/script.js"></script>

    <!-- Recursos do autor (manutenção / edição direta) -->
    <script src="../js/global-admin.js"></script>

</body>
</html>
