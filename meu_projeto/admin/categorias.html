<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Categorias – Silver Fox Admin</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin-body">

    <header id="adminHeader" class="admin-header site-header sticky-top"></header>

    <main class="py-5" id="conteudo">

        <div class="container">
            <div id="adminBanner" class="mb-4"></div>

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 border-bottom pb-3 mb-4">
                <div>
                    <span class="section-label">PAINEL DE CONTROLE</span>
                    <h1 class="display-6 mt-1 mb-0 font-primary">Categorias</h1>
                </div>
                <a href="index.html" class="btn btn-sm btn-outline-secondary">← Dashboard</a>
            </div>

            <div class="row g-4">
                <div class="col-lg-5">
                    <div class="admin-card p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 font-primary text-primary mb-0" id="catFormTitle">Nova categoria</h2>
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="btnCancelCatEdit" hidden>Cancelar edição</button>
                        </div>
                        <form id="formCategory" class="row g-3" novalidate>
                            <div class="col-12">
                                <label for="catName" class="form-label small text-muted">Nome *</label>
                                <input type="text" id="catName" class="form-control admin-input" required maxlength="60">
                            </div>
                            <div class="col-12">
                                <label for="catSlug" class="form-label small text-muted">Identificador (gerado do nome)</label>
                                <input type="text" id="catSlug" class="form-control admin-input" readonly>
                            </div>
                            <div class="col-12">
                                <label for="catDesc" class="form-label small text-muted">Descrição</label>
                                <textarea id="catDesc" class="form-control admin-input" rows="3" maxlength="200"></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary-custom w-100 py-2">Salvar categoria</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="admin-card p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 font-primary text-primary mb-0">Categorias cadastradas</h2>
                            <span id="categoryCountBadge" class="badge bg-secondary"></span>
                        </div>
                        <div id="categoriesManagementList" class="d-flex flex-column gap-2"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../data/library.js"></script>
    <script src="../js/core/data.js"></script>
    <script src="../js/modules/notifications.js"></script>
    <script src="../js/admin/admin-core.js"></script>
    <script src="../js/admin/categorias-admin.js"></script>
</body>
</html>
